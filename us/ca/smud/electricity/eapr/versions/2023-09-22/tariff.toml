# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Section III.2, Sheet EAPR-1: a 100 percent reduction in electricity usage cost per kWh, capped at a maximum monthly discount that steps with federal poverty level ($60 at 0-50 percent, $32 above 50 to 100 percent, $10 above 100 to 150 percent, $0 above 150 to 200 percent). Modeled on branch dcj/eapr-capped-discount, using three terms no URPX release defines: urpx:ValueExpression, urpx:minOperator and urpx:currencyUnit, with urpx:hasValueExpression on CalculationMethod. They are proposed in a draft urpx-org/urpx PR implementing part of urpx-dev spec 041, value expressions (branch dcj/value-expressions-min-max, commit b1c56e6f); against the pinned shapes the filing fails SHACL on exactly those terms, and it conforms against that commit. Four urpx:ProfileAlternative over the custom dimension federalPovertyLevelBand each select a Price of -1 per dollar on a calculated urpx:MetricInput whose CalculationMethod carries min(usage cost, cap). The usage cost is a calculated MetricInput in urpx:currencyUnit whose derivation, the sum of the base plan's Electricity Usage Charges over the billing period, is carried as urpx:calculationFormula text rather than as a structured expression. Whether the Section VI Hydro Generation Adjustment surcharge counts as usage cost is not stated by this schedule; HGA is not modeled in the SMUD base plans.",
 "Section III.3, Sheet EAPR-1: the EAPR Rate Stabilization Fund additional monthly discount, $0 to $35 per month, available only at 0 to 50 percent of federal poverty level. Not modeled because this filing publishes only the band; the schedule says the Accountant determines the amount annually from available discretionary non-retail rate revenue and fixes it before the year it applies, and no year's figure appears in this PDF. A source gap, not a vocabulary gap. A declarative band via hasDynamicPricing priceFloor and priceCeiling would validate, but it would bound the discount without stating an amount to bill.",
 "Section V, Sheet EAPR-2: this schedule prices four discounts outside residential service and none is modeled. Nonprofit accounts on a residential rate receive the maximum residential discount (the schedule does not define that term). Eligible Commercial and Industrial customers receive 15 percent off the Electricity Usage Charge (kWh), Maximum Demand Charge (kW), Site Infrastructure Charge (kW) and Summer Peak Demand Charge (kW) each billing period. CI-TOD1's System Infrastructure Fixed Charge receives 35 percent, and CI-TOD2, CI-TOD3 and CI-TOD4's receive 15 percent. The percentages themselves are expressible (urpx:multiplier with urpx:basedOnPrice on PriceShape, the pattern that resolves for the CARE and FERA discounts), so nothing here is blocked by vocabulary. Whether they count against a residential-focused corpus is an open corpus-level scope ruling: LAYOUT 4.4 scopes complete to the source document, which argues they count, while no SMUD Commercial and Industrial base plan exists here for them to attach to. The ruling belongs in MODELING-GAPS.md and settles sce:da-crs, sce:cca-crs and sdge:care Section 2 at the same time. Section IV (nonprofit eligibility) and Section VI (a cross-reference to Schedule HGA) price nothing and are correctly out of scope.",
 "Section VIII, Sheet EAPR-3: the $10 per month System Infrastructure Fixed Charge discount that this filing does model is prorated for billing periods shorter than 27 days, on the relationship between the length of the billing period and 30 days, while the maximum electricity usage discount is expressly not prorated regardless of the number of days or of spanning seasons. Neither rule is carried. urpx:prorationMethod would state the first: it is xsd:string, 0..1, on BillingModelShape. It is free text and no filing in this corpus uses it, so it would carry the rule as prose rather than as a computable adjustment.",
 "Section VII, Conditions of Service, states application and verification terms on this schedule that are in no part of the model. Verbatim in part: \"To qualify for EAPR, the customer must complete a SMUD application and submit requested supporting documents. Applications are processed by SMUD or SMUD's designated agent.\" \"Upon request, applicants shall provide proof, satisfactory to SMUD or its designated agent, that they meet the eligibility requirements. Failure to provide proof as requested will be considered just cause for denial to enroll in EAPR.\" The EligibilityRule carries residential customer kind AND Program Enrollment = EAPR.",
 "Section VIII's enrollment and termination timing determines which billing periods the modeled $10 discount applies to and is unmodeled. Verbatim: \"The effective date of EAPR will be the beginning of the billing period in which the request is approved. If participation is terminated, the effective termination date will be the beginning of the billing period in which the request is received or the cancellation date.\" The verification named this explicitly and set it aside as enrollment mechanics.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "first filing of SMUD EAPR. $10/month BSC discount as a -10.00 per month credit. Income-tier usage-cap discount modeled on branch dcj/eapr-capped-discount against a draft urpx-org/urpx PR (ValueExpression with minOperator, currencyUnit). For 150-200% FPL customers (where usage cap = $0), the BSC discount is the ENTIRE EAPR benefit; for 0-50% FPL customers, modeled BSC discount captures ~14% of benefit. Eligibility predicate: 'Program Enrollment' = 'Energy Assistance Program (EAPR)'. applicableToRatePlan: 2 SMUD residential bases (tod-5-8pm, fixed). Stacks additively with MED."
